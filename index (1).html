<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Página</title>
    <link rel="stylesheet" href="style (1).css">
</head>
<body>
    <div class="container">
        <!-- CABEÇALHO -->
        <header>
            <div class="logo">
                LOGO
            </div>
            <nav>
                <a href="#">
                    Início
                </a>
                <a href="#">
                    Sobre
                </a>
                <a href="#">
                    Projetos
                </a>
                <a href="#">
                    Contato
                </a>
            </nav>
        </header>
        <!-- CONTEÚDO PRINCIPAL -->
        <main>
            <!-- PERFIL -->
            <div class="perfil">
                <div class="foto">
                    FOTO
                </div>
            </div>
            <!-- CARDS -->
            <div class="cards">
                <section class="card">
                    <h2>
                        Sobre mim
                    </h2>
                    <p>
                        Aqui podemos colocar informações sobre o perfil profissional.
                    </p>
                    <p>
                        Formação, experiências, habilidades e objetivos.
                    </p>
                </section>
                <section class="card">
                    <h2>
                        Projetos
                    </h2>
                    <p>
                        Projeto 01
                    </p>
                    <p>
                        Projeto 02
                    </p>
                    <p>
                        Projeto 03
                    </p>
                </section>
            </div>
        </main>
        <!-- RODAPÉ -->
        <footer>
            <h2>
                Informações
            </h2>
            <p>
                E-mail: exemplo@email.com
            </p>
            <p>
                Telefone: (46) 99999-9999
            </p>
        </footer>
    </div>
</body>
</html>
